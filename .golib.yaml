schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./adapters/config
        - ./adapters/http
        - ./adapters/jsonapi
        - ./adapters/jsonrpc
        - ./adapters/service
        - ./rules
        - ./structplan
        - ./validationconfig
        - ./validationhttp
        - ./validationjsonapi
        - ./validationobserve
        - ./validationrpc
        - ./validationservice
        - ./validationtest
        - ./validationtext

operations:
  - module: .
    gate: conformance
    steps:
      - type: go-test
        packages:
          - .
          - ./adapters/http
          - ./adapters/jsonapi
          - ./adapters/jsonrpc
          - ./validationhttp
          - ./validationjsonapi
          - ./validationrpc
        run: '^TestPathPreservesTypedSegmentsAndEscapesPointers$|^TestTransportProjectionsPreserveConformanceAndEscapeLocations$|^TestProblemAndWriterAreRouterNeutralAndEscaped$|^TestProblemWriterAndHookPreserveLegacyBehavior$|^TestWarningProblemPreservesSeverityAndTruncation$|^TestWarningProblemIsSuccessful$|^TestErrorsUseJSONPointersAndStableCodes$|^TestErrorsPreservePathsSeverityAndHiddenBlockingState$|^TestErrorsProjectBlockingSeverity$|^TestWarningsAndTruncationRemainMachineReadable$|^TestTruncatedBlockingStateSurvivesWarningRetention$|^TestInvalidParamsPreservesSafeStableData$|^TestInvalidParamsProjectsWarningsAndTruncation$'
        count: 1
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: go-test
        packages: [./...]
        run: '^Example'
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPathAndReportSafety$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./rules]
        fuzz: '^FuzzUnicodeAndMalformedPrimitives$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./structplan]
        fuzz: '^FuzzTagGrammarNeverPanics$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./structplan]
        fuzz: '^FuzzCompiledPlansAcrossSupportedShapes$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./structplan]
        fuzz: '^FuzzTypedPlanConstructionNeverPanics$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./validationjsonapi]
        fuzz: '^FuzzProjectionPaths$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./adapters/jsonapi]
        fuzz: '^FuzzProjectionPaths$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: BenchmarkValidation
        budget: 100ms
        timeout: 20m
