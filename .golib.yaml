schema_version: 1
tool_version: v1.0.13
tool_checksums_sha256: 164e5c8abefe655958f522677856816faddbd2a8d40eba7d37ba5a031210df70

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./rules
        - ./structplan
        - ./validationconfig
        - ./validationhttp
        - ./validationjsonapi
        - ./validationobserve
        - ./validationrpc
        - ./validationservice
        - ./validationtest
        - ./validationtext

operations:
  - module: .
    gate: conformance
    steps:
      - type: go-test
        packages:
          - .
          - ./validationhttp
          - ./validationjsonapi
          - ./validationrpc
        run: '^TestPathPreservesTypedSegmentsAndEscapesPointers$|^TestTransportProjectionsPreserveConformanceAndEscapeLocations$|^TestProblemAndWriterAreRouterNeutralAndEscaped$|^TestWarningProblemPreservesSeverityAndTruncation$|^TestErrorsUseJSONPointersAndStableCodes$|^TestWarningsAndTruncationRemainMachineReadable$|^TestTruncatedBlockingStateSurvivesWarningRetention$|^TestInvalidParamsPreservesSafeStableData$|^TestInvalidParamsProjectsWarningsAndTruncation$'
        count: 1
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: go-test
        packages: [./...]
        run: '^Example'
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPathAndReportSafety$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./rules]
        fuzz: '^FuzzUnicodeAndMalformedPrimitives$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./structplan]
        fuzz: '^FuzzTagGrammarNeverPanics$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./structplan]
        fuzz: '^FuzzCompiledPlansAcrossSupportedShapes$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./structplan]
        fuzz: '^FuzzTypedPlanConstructionNeverPanics$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [./validationjsonapi]
        fuzz: '^FuzzProjectionPaths$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: BenchmarkValidation
        budget: 100ms
        timeout: 20m
